<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-light bg-white px-4">
            <div class="container-fluid d-flex flex-column flex-lg-row align-items-center justify-content-between">
                <a class="navbar-brand mb-2 mb-lg-0" href="index.html">MealMate</a>
                <form class="d-flex align-items-center mb-2 mb-lg-0 " style="max-width: 300px; width: 100%;">
                        <input id="searchInput" class="form-control me-2 search-input" type="search"
                            placeholder="Search Recipes..." aria-label="Search">
                        <button id="searchBtn" class="btn btn-outline-success btn-search" type="submit">Search</button>
                    </form>
                
                <div class="d-flex align-items-center social-icon">
                    
                    <a href="index.html" class="me-3"><img src="assets/images/Social_Icons/home.png" alt="Home"></a>
                    <a href="#" class="me-3"><img src="assets/images/Social_Icons/facebook.png" alt="Facebook"></a>
                    <a href="#" class="me-3"><img src="assets/images/Social_Icons/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="assets/images/Social_Icons/youtube (2).png" alt="YouTube"></a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="py-5">
            <div class="container card p-4 shadow" id="recipeCard">
                <div class="text-center">
                    <h2 id="mealTitle" class="text-warning fw-bold mb-4"></h2>
                    <img id="mealImage" src="" alt="Meal Image" class="w-25 rounded-3 mx-auto mb-4">
                    <p id="mealAreaTags" class="fw-bold text-info"></p>

                    <div class="row p-4">
                        <div class="col-md-6 align-items-center">
                            <h4 class="fw-bold text-warning">Ingredients</h4>
                            <div class="ms-lg-5">
                                <ul id="mealIngredients" class="d-flex flex-column text-start "
                                    style="max-height: 400px;"></ul>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h4 class="fw-bold text-warning">Instructions</h4>
                            <ol class="list-unstyled">
                                <p id="mealInstructions" class="text-start"></p>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer text-white text-center py-4 mt-4">
        <div class="container">
            <h3 class="footer-brand mb-2">MealMate</h3>
            <p class="mb-1">MealMate — Your best friend in the kitchen.</p>
            <p class="mb-0">© 2025 RecipeApp. All Rights Reserved. Shashith Malshan</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
