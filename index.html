<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<body>
    <header>
        <!-- Main Navbar -->
        <nav class="navbar navbar-light bg-white px-4">
            <div class="container-fluid d-flex flex-column flex-lg-row align-items-center justify-content-between">
                <a class="navbar-brand mb-2 mb-lg-0" href="#">MealMate</a>
                <div class="d-flex align-items-center social-icon">
                    <form class="d-flex align-items-center mb-2 mb-lg-0 me-3" style="max-width: 300px; width: 100%;">
                        <input id="searchInput" class="form-control me-2 search-input" type="search"
                            placeholder="Search Recipes..." aria-label="Search">
                        <button id="searchBtn" class="btn btn-outline-success btn-search" type="submit">Search</button>
                    </form>
                    <a href="#" class="me-3"><img src="assets/images/Social_Icons/facebook.png" alt="Facebook"></a>
                    <a href="#" class="me-3"><img src="assets/images/Social_Icons/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="assets/images/Social_Icons/youtube (2).png" alt="YouTube"></a>
                </div>
            </div>
        </nav>

        <!-- Sub Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark sub-navbar">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#subNavbar"
                    aria-controls="subNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="subNavbar">
                    <ul class="navbar-nav flex-column flex-lg-row">
                        <li class="nav-item">
                            <a class="nav-link" href="#discover">Discover</a>
                        </li>

                        <li class="nav-item dropdown" id="categoryDropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">Category</a>
                            <ul class="dropdown-menu"></ul>
                        </li>

                        <li class="nav-item dropdown" id="areaDropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">Area</a>
                            <ul class="dropdown-menu"></ul>
                        </li>

                        <li class="nav-item dropdown" id="ingredientsDropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">Ingredients</a>
                            <ul class="dropdown-menu"></ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
